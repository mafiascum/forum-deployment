services:
  mafiascum.votecounter.listener:
    class: mafiascum\votecounter\event\main_listener
    arguments:
      - "@template"
      - "@user"
      - "@dbal.conn"
      - "%core.table_prefix%"
      - "@auth"
      - "@user_loader"
      - "@config"
    tags:
      - { name: event.listener }

  mafiascum.votecounter.votecountSettingsController:
    class: mafiascum\votecounter\controller\votecountSettings
    arguments:
      - "@controller.helper"
      - "@template"
      - "@request"
      - "@user_loader"
      - "@dbal.conn"
      - "@user"
      - "%core.table_prefix%"
