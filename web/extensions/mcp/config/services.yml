services:
    mafiascum.mcp.listener:
        class: mafiascum\mcp\event\main_listener
        arguments:
            - '@template'
            - '@dbal.conn'
            - '@user'
            - '@auth'
            - '%core.table_prefix%'
            - '%core.root_path%'
            - '%core.php_ext%'
        tags:
            - { name: event.listener }
