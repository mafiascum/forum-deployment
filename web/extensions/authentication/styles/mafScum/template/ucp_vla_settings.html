<!-- INCLUDE ucp_header.html -->

<form id="ucp" method="post" action="{S_UCP_ACTION}"{S_FORM_ENCTYPE}>
	<h2 class="leading-6">{L_TITLE}</h2>

	<!-- IF ERROR -->
	<div class="text-sm text-red-300 bg-red-950/40 border border-red-800/50 rounded-lg p-4 my-4" role="alert">{ERROR}</div>
	<!-- ENDIF -->

	<!-- IF S_IS_VLA -->
	<div class="flex gap-3 text-sm text-amber-200 bg-amber-950/30 border border-amber-800/40 rounded-lg p-4 my-4" role="status">
		<i class="iconify shrink-0" data-mode="style" data-icon="ph:airplane-tilt" data-width="18" data-height="18" aria-hidden="true"></i>
		<span>Currently V/LA. Update the dates below or clear your status.</span>
	</div>
	<!-- ENDIF -->

	<div class="card p-0 overflow-hidden mt-4">
		<div class="p-4 border-b">
			<h3 class="font-semibold">{L_UCP_VLA_SETTINGS_TITLE}</h3>
			<p class="text-sm text-secondary mt-1">Set the first and last day you will have limited access.</p>
		</div>
		<div class="divide-y">
			<dl class="p-4 md:grid md:grid-cols-3 md:gap-5 md:items-center">
				<dt class="text-sm font-medium"><label for="vlastart_day">{L_VLA_SET_START_DATE}{L_COLON}</label></dt>
				<dd class="md:col-span-2 max-md:mt-2 grid grid-cols-3 gap-2">
					<label class="text-xs text-secondary">{L_DAY}<select class="inputbox mt-1" name="vlastart_day" id="vlastart_day">{S_VLASTART_DAY_OPTIONS}</select></label>
					<label class="text-xs text-secondary">{L_MONTH}<select class="inputbox mt-1" name="vlastart_month" id="vlastart_month">{S_VLASTART_MONTH_OPTIONS}</select></label>
					<label class="text-xs text-secondary">{L_YEAR}<select class="inputbox mt-1" name="vlastart_year" id="vlastart_year">{S_VLASTART_YEAR_OPTIONS}</select></label>
				</dd>
			</dl>
			<dl class="p-4 md:grid md:grid-cols-3 md:gap-5 md:items-center">
				<dt class="text-sm font-medium"><label for="vlatill_day">{L_VLA_SET_END_DATE}{L_COLON}</label></dt>
				<dd class="md:col-span-2 max-md:mt-2 grid grid-cols-3 gap-2">
					<label class="text-xs text-secondary">{L_DAY}<select class="inputbox mt-1" name="vlatill_day" id="vlatill_day">{S_VLATILL_DAY_OPTIONS}</select></label>
					<label class="text-xs text-secondary">{L_MONTH}<select class="inputbox mt-1" name="vlatill_month" id="vlatill_month">{S_VLATILL_MONTH_OPTIONS}</select></label>
					<label class="text-xs text-secondary">{L_YEAR}<select class="inputbox mt-1" name="vlatill_year" id="vlatill_year">{S_VLATILL_YEAR_OPTIONS}</select></label>
				</dd>
			</dl>
		</div>
		<div class="flex flex-wrap gap-2 justify-end p-4 border-t">
			{S_HIDDEN_FIELDS}
			<button type="reset" name="reset" class="btn-primary-outline relative flex overflow-hidden transition-all duration-300 justify-center">{L_RESET}</button>
			<!-- IF S_IS_VLA --><button type="submit" name="clearVLA" class="btn-primary-outline relative flex overflow-hidden transition-all duration-300 justify-center">{L_CLEAR_VLA}</button><!-- ENDIF -->
			<button type="submit" name="submit" class="btn-primary relative flex overflow-hidden transition-all duration-300 justify-center">{L_SUBMIT}</button>
			{S_FORM_TOKEN}
		</div>
	</div>
</form>

<!-- INCLUDE ucp_footer.html -->
